name: CI Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master

jobs:
  check:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npx prettier --check .

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type Check
        run: npm run type-check

      # 暫定: テストファイルがないため、vitestが入っていれば実行、なければスキップ
      # 現状はVitest未導入の可能性があるため、条件付き実行または導入後に有効化
      # ここでは一旦コメントアウトし、後ほどVitest導入時に有効化する
      # - name: Unit Test
      #   run: npm run test

      - name: Build
        run: npm run build
